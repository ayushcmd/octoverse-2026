<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" preserveAspectRatio="none" width="100%" height="80">
  <defs>
    <!-- Plus symbol definition -->
    <g id="orangePlusBottom">
      <rect x="-20" y="-7" width="40" height="14" rx="4" fill="#f0883e" />
      <rect x="-7" y="-20" width="14" height="40" rx="4" fill="#f0883e" />
    </g>

    <!-- Octocat silhouette path definition (viewBox 0 0 98 96 normalized to ~72px height) -->
    <path id="octocatSilhouette" d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548 3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z" />
  </defs>

  <!-- Colorful Background Blocks & Shapes -->
  <!-- Section 1 (x: 0 - 160): Mint & Orange -->
  <rect x="0" y="0" width="160" height="80" fill="#7ee787" />
  <path d="M 0 0 Q 70 80, 160 40 L 160 80 L 0 80 Z" fill="#f0883e" />

  <!-- Section 2 (x: 160 - 320): Lime & Yellow -->
  <rect x="160" y="0" width="160" height="80" fill="#56d364" />
  <path d="M 160 80 Q 220 10, 320 20 L 320 80 Z" fill="#f1e05a" />

  <!-- Section 3 (x: 320 - 480): Blue & Orange -->
  <rect x="320" y="0" width="160" height="80" fill="#4493f8" />
  <path d="M 320 0 Q 400 80, 480 30 L 480 80 L 320 80 Z" fill="#f0883e" />

  <!-- Section 4 (x: 480 - 640): Violet & Pink -->
  <rect x="480" y="0" width="160" height="80" fill="#8957e5" />
  <path d="M 480 80 Q 550 0, 640 40 L 640 80 Z" fill="#f778ba" />

  <!-- Section 5 (x: 640 - 820): Yellow & Dark Violet -->
  <rect x="640" y="0" width="180" height="80" fill="#d29922" />
  <path d="M 640 0 Q 720 70, 820 10 L 820 80 L 640 80 Z" fill="#7c3aed" />

  <!-- Section 6 (x: 820 - 1000): Lime & Pink -->
  <rect x="820" y="0" width="180" height="80" fill="#56d364" />
  <path d="M 820 80 Q 900 15, 1000 60 L 1000 80 Z" fill="#f778ba" opacity="0.8" />

  <!-- Rhythmic Parade of Colorful Octocat Silhouettes -->
  <!-- 1. Mint / Teal silhouette -->
  <use href="#octocatSilhouette" transform="translate(10, 12) scale(0.68)" fill="#3fb950" opacity="0.95" />
  <!-- 2. Yellow silhouette -->
  <use href="#octocatSilhouette" transform="translate(125, 8) scale(0.72)" fill="#f1e05a" opacity="0.95" />
  <!-- 3. Royal Blue silhouette -->
  <use href="#octocatSilhouette" transform="translate(245, 10) scale(0.70)" fill="#388bfd" opacity="0.95" />
  <!-- 4. Bright Orange silhouette -->
  <use href="#octocatSilhouette" transform="translate(365, 8) scale(0.72)" fill="#f0883e" opacity="0.95" />
  <!-- 5. Violet silhouette -->
  <use href="#octocatSilhouette" transform="translate(485, 12) scale(0.68)" fill="#bc8cff" opacity="0.95" />
  <!-- 6. Pink silhouette -->
  <use href="#octocatSilhouette" transform="translate(605, 8) scale(0.72)" fill="#f778ba" opacity="0.95" />
  <!-- 7. Gold silhouette -->
  <use href="#octocatSilhouette" transform="translate(725, 10) scale(0.70)" fill="#e3b341" opacity="0.95" />
  <!-- 8. Deep Purple silhouette -->
  <use href="#octocatSilhouette" transform="translate(845, 8) scale(0.72)" fill="#7c3aed" opacity="0.95" />
  <!-- 9. Green silhouette -->
  <use href="#octocatSilhouette" transform="translate(930, 12) scale(0.68)" fill="#2ea043" opacity="0.95" />

  <!-- Block 7: Terminal block with >_ symbol (x: 1000 - 1100) -->
  <rect x="1000" y="0" width="100" height="80" fill="#0d1117" />
  <text x="1050" y="55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">&gt;_</text>

  <!-- Block 8: Lime green block with orange plus (x: 1100 - 1200) -->
  <rect x="1100" y="0" width="100" height="80" fill="#56d364" />
  <use href="#orangePlusBottom" x="1150" y="40" />
</svg>
